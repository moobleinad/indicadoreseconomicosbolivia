name: Automatización 24/7 Indicadores Económicos Bolivia

on:
  schedule:
    # 08:45 AM BOT (UTC-4) -> 12:45 UTC
    - cron: '45 12 * * *'
    # 20:00 PM BOT (UTC-4) -> 00:00 UTC (del día siguiente)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-indicadores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código del proyecto
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias requeridas
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Ejecutar verificación y actualización de indicadores en Blogger y WhatsApp
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          WHATSAPP_CLOUD_API_TOKEN: ${{ secrets.WHATSAPP_CLOUD_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT_ID: ${{ secrets.WHATSAPP_RECIPIENT_ID }}
        run: |
          python 05_SCRIPTS_Y_HERRAMIENTAS/auto_update_indicadores.py
